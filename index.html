<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./apple.png">
<title>Static UI - Layout Editor</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    background: #fff;
    overflow-x: hidden;
}

body {
    padding-top: env(safe-area-inset-top);
    font-family: Arial, sans-serif;
}

img {
    -webkit-user-drag: none;
    user-select: none;
}

.container {
    position: relative;
    width: 390px;
    max-width: 100%;
    margin: 0 auto;
}

.bg-image {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none;
}

#clock {
    position: absolute;
    top: 352px;
    left: 16px;
    font-family: sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: #000;
    z-index: 100;
    user-select: none;
    background: transparent;
    padding: 1px 4px;
    border-radius: 2px;
    white-space: nowrap;
}

#clock-bg {
    position: absolute;
    top: 352px;
    left: 16px;
    background: #fff;
    border-radius: 2px;
    z-index: 1;
    pointer-events: none;
}

#white-block {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 390px;
    height: 100px;
    background: #fff;
    z-index: 9;
    user-select: none;
}

#yellow-block {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(55px + env(safe-area-inset-top));
    background: linear-gradient(
        to right,
        #f2b15d,
        #f1b262,
        #f1b765,
        #f3bc6a,
        #f4c06d,
        #f4c575,
        #f7c97b,
        #f7d281
    );
    z-index: 999;
    user-select: none;
}

#name-img {
    position: absolute;
    top: 154.41px;
    left: 153.56px;
    width: 198px;
    z-index: 10;
}

#car-img {
    position: absolute;
    top: 391.27px;
    left: 125.95px;
    width: 207px;
    z-index: 10;
    opacity: 0.7;
}

#rest-img {
    position: absolute;
    top: 619.71px;
    left: 6.70px;
    width: 381px;
    z-index: 10;
}

#pulse-logo {
    position: fixed;
    top: calc(242.52px + env(safe-area-inset-top));
    left: 25%;
    transform: translateX(-50%);
    width: 200px;
    filter: brightness(0) invert(80%) sepia(0) saturate(0);
    z-index: 5;
    animation: pulse-animation 1.6s infinite ease-in-out;
}

#header-img {
    position: fixed;
    top: env(safe-area-inset-top);
    left: 50%;
    transform: translateX(-50%);
    width: 390px;
    max-width: 100%;
    z-index: 1000;
    pointer-events: none;
}

#bottom-img {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 390px;
    max-width: 100%;
    z-index: 10;
}

#qr-nav-btn {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 35px;
    width: 80px;
    height: auto;
    z-index: 200;
    transition: opacity 0.2s;
}

#qr-close-btn {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 38px;
    width: 75px;
    height: auto;
    z-index: 2001;
    transition: opacity 0.2s;
}

@keyframes pulse-animation {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

#qr-popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #fff;
    z-index: 2000;
    overflow: hidden;
    justify-content: center;
    align-items: center;
}

#qr-popup-overlay.active {
    display: flex;
}

#qr-popup-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

#qr-popup-bg {
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    pointer-events: none;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
}
</style>
</head>

<body>

<div id="yellow-block"></div>

<div class="container" id="main-container">
    <img src="./background.png" class="bg-image" id="bg-img" alt="Background" draggable="false">

    <div id="white-block"></div>

    <div id="clock-bg"></div>

    <div id="clock">
        <span id="clock-text"></span>
    </div>

    <img src="./name.png" id="name-img" alt="Name Overlay" draggable="false">

    <img src="./car.png" id="car-img" alt="Car Overlay" draggable="false">

    <img src="./rest.png" id="rest-img" alt="Rest Overlay" draggable="false">
</div>

<img src="./button.png" id="qr-nav-btn" alt="QR Code Button" draggable="false">

<img src="./bottom.png" id="bottom-img" alt="Bottom" draggable="false">

<img src="./pulse-logo.png" id="pulse-logo" alt="Pulsing Logo" draggable="false">

<img src="./header.png" id="header-img" alt="Header" draggable="false">

<div id="qr-popup-overlay">
    <div id="qr-popup-container">
        <img src="./qrback.png" id="qr-popup-bg" alt="QR Background" draggable="false">
    </div>

    <img src="./button.png" id="qr-close-btn" alt="Back Button" draggable="false">
</div>

<script>
"use strict";

/* Disable native browser image dragging. */
document.addEventListener("dragstart", function(event) {
    if (event.target instanceof HTMLImageElement) {
        event.preventDefault();
    }
});

/* QR popup functionality. */

document.getElementById("qr-nav-btn").addEventListener("click", function() {
    qrOverlay.classList.add("active");
    document.body.style.overflow = "hidden";
});

document.getElementById("qr-close-btn").addEventListener("click", function() {
    qrOverlay.classList.remove("active");
    document.body.style.overflow = "";
});

const qrOverlay = document.getElementById("qr-popup-overlay");

/* Clock background positioning. */

const mainContainer = document.getElementById("main-container");
const clockEl = document.getElementById("clock");
const clockBgEl = document.getElementById("clock-bg");

function syncClockBg() {
    if (!clockEl || !clockBgEl || !mainContainer) return;

    const clockRect = clockEl.getBoundingClientRect();
    const containerRect = mainContainer.getBoundingClientRect();

    clockBgEl.style.left = (clockRect.left - containerRect.left) + "px";
    clockBgEl.style.top = (clockRect.top - containerRect.top) + "px";
    clockBgEl.style.width = clockRect.width + "px";
    clockBgEl.style.height = clockRect.height + "px";
}

/* Live clock. */

function updateClock() {
    const now = new Date();

    let hours = now.getHours();
    const ampm = hours >= 12 ? "pm" : "am";

    hours = hours % 12 || 12;

    const minutes = String(now.getMinutes()).padStart(2, "0");

    document.getElementById("clock-text").textContent =
        `${now.getDate()} ` +
        `${now.toLocaleString("default", { month: "short" })} ` +
        `${now.getFullYear()} ${hours}:${minutes}${ampm}`;

    syncClockBg();
}

setInterval(updateClock, 1000);
updateClock();

window.addEventListener("resize", syncClockBg);
</script>

</body>
</html>
